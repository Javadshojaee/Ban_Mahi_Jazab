<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="rY5Eu4obZ2d-pKjbZijrL22Dxe8S7lsky63NfWPoQV0"
    />
    <title>تولدت مبارک</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="shortcut icon" href="./Images/Images.jpg" type="image/x-icon" />
  </head>
  <body>
    <div class="stars-bg"></div>
    <main class="card-container">
      <div class="title-area">
        <span class="sub-badge">🔥 خشن‌ترین و جذاب‌ترین متولد ماه</span>
        <h1 class="main-title">تولدت مبارک<br />خواهر قشنگم🎂</h1>
      </div>

      <div class="cake-scene">
        <div class="candle" id="candle" title="برای فوت کردن کلیک کن!">
          <div class="flame" id="flame"></div>
          <div class="smoke" id="smoke"></div>
          <div class="wick"></div>
        </div>

        <div class="cake-body">
          <div class="cake-frosting">
            <div class="drips">
              <span class="drip"></span>
              <span class="drip"></span>
              <span class="drip"></span>
              <span class="drip"></span>
            </div>
          </div>
        </div>

        <div class="plate"></div>
      </div>

      <p class="hint">💨 روی شمع بزن تا فوتش کنی!</p>

      <button class="surprise-btn" id="surpriseBtn">
        🎁✨ یه متن کوچولو نوشتم ببین
      </button>

      <div class="secret-message" id="secretMsg">
        هرچقدر هم که زود از کوره در بری و اخم کنی، باز هم عزیزترین خواهر دنیایی!
        🌸❤️ امیدوارم سال جدید زندگیت پر از آرامش، خنده و رسیدن به همه آرزوهات
        باشه! 🎉
      </div>
      <p>Make with your brother</p>
    </main>
    <script src="./js/main.js"></script>
  </body>
</html>
